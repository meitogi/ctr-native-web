# Test overlay : HAProxy with a minimal HTTPS frontend and the kit's ctr-relay.cfg.
services:
  haproxy:
    image: haproxy:3.4.7-alpine
    command: [haproxy, -f, /usr/local/etc/haproxy/haproxy.cfg, -f, /usr/local/etc/haproxy/ctr-relay.cfg]
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN}
    volumes:
      - ${TEST_DIR}/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ${TEST_DIR}/../haproxy/ctr-relay.cfg:/usr/local/etc/haproxy/ctr-relay.cfg:ro
      - ${TEST_DIR}/.tmp/relay.pem:/certs/relay.pem:ro
    depends_on:
      ctr-relay: { condition: service_healthy }
    networks:
      proxy:
        aliases: [relay.test]
